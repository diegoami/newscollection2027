[project]
name = "newscollection2027"
version = "0.1.0"
description = "Static tech-news site that clusters feed items across outlets and checks their claims against each other."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "pyyaml>=6.0.3",
    # T20 (nc.embed): a static sentence-embedding model, not
    # sentence-transformers/torch or fastembed/onnxruntime -- see
    # src/nc/embed.py's module docstring and config/embed.yaml for the
    # cost reasoning.
    "model2vec>=0.9.0",
]

[project.scripts]
nc = "nc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nc"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
