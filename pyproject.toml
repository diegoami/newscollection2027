[project]
name = "newscollection2027"
version = "0.1.0"
description = "Static tech-news site that clusters feed items across outlets and checks their claims against each other."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "pyyaml>=6.0.3",
    # T20 (nc.embed): a static sentence-embedding model, not
    # sentence-transformers/torch or fastembed/onnxruntime -- see
    # src/nc/embed.py's module docstring and config/embed.yaml for the
    # cost reasoning.
    "model2vec>=0.9.0",
    "pydantic>=2.13.5",
    "jsonschema>=4.26.0",
]

[project.scripts]
nc = "nc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nc"]

# T31's API analysis backend only. Deliberately NOT a runtime dependency:
# docs/ARCHITECTURE.md's cost model puts the nightly analysis on the Claude
# Code subscription, so `nc ingest`, `nc embed`, `nc cluster`, `nc validate`
# and `nc build` -- everything the every-three-hours workflow runs -- must
# keep working with no SDK installed and no API key. src/nc/analyze.py
# imports it lazily so that stays true. Install with `uv sync --extra api`.
[project.optional-dependencies]
api = ["anthropic>=0.40"]

[dependency-groups]
dev = [
    # So `make check` type-checks nc.analyze. See the extra above for why
    # this is not a runtime dependency.
    "anthropic>=0.40",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "types-pyyaml>=6.0.12.20260906",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
