# Clustering window and thresholds for nc.cluster / `nc cluster` (T21).
#
# CLAUDE.md: "Model ids and thresholds live in config/, never inline in
# code." A file of its own, next to config/embed.yaml, because the
# thresholds below are tuned against whichever embedding model that file
# names -- change the model and these values are meaningless until
# re-tuned.
#
# ===========================================================================
# SET FROM 159 LABELLED PAIRS. T23 IS NOT FINISHED -- REVISIT THESE.
# ===========================================================================
#
# These are measured, not guessed, which is the difference from what
# stood here before. They are not final. T23 asks for at least 200
# labelled near-threshold pairs and the first session produced 159, the
# labelling corpus is still growing with every ingest run, and the one
# number that prices `tau_low` -- how many pairs a run lands in the
# widened band -- has not been measured yet. Treat them as the best
# available reading of real evidence, and expect to move them.
#
# These are no longer guesses, but they are also not the numbers T23
# was expected to produce. The labelling session found that cosine
# cannot separate the two populations at all: a different-story pair
# scored 0.7710 while true matches ran down to 0.5708. No cutoff links
# the true pairs without also linking that false one. `nc bench-embed`
# then measured six embedding models over a 64x parameter range
# (2M to 128M) and the separability did not move -- see
# docs/CLUSTERING.md. So the thresholds below do not try to classify.
# They route.

# Pairs at or above tau_high are linked automatically, with no judge
# and no second opinion.
#
# 1.0 switches that off, deliberately. It does not mean "never link":
# two outlets running identical wire copy embed to the same vector and
# still link at cosine 1.0, which is correct -- identical text is the
# same story. It means nothing links on a *judgement* about similarity.
#
# Why give it up. The two errors are not symmetric. A false link merges
# unrelated stories into one cluster and the analysis step dutifully
# reports "discrepancies" between outlets that never covered the same
# event -- a visibly wrong story, with verbatim quotes that make it look
# authoritative, and nothing downstream can recover it. A missed link
# only costs a story an outlet, and T24's judge is exactly what recovers
# those. Measured at T23, the highest threshold with no false link at
# all reached 3 of 27 true pairs (recall 0.111): auto-linking bought
# about 10 links a run while owning the only unrecoverable failure mode
# in the pipeline. That is a bad trade at any price, and the benchmark
# showed no model that improves it.
#
# What cosine is good at, on the same evidence, is *ranking*: every
# model measured scored 0.89-0.95 AUC, and the one configured today is
# the best of them at 0.946. So it stays in the pipeline as a recall
# filter that keeps the judge from being handed all ~49,000 pairs in a
# window -- not as a classifier.
tau_high: 1.00

# Pairs below tau_low never link and are never judged. With tau_high at
# 1.0, tau_low is now the only threshold that decides anything: the
# band [tau_low, 1.0) is the judge's queue, and this number is the line
# between "worth an LLM call" and "not a story pair".
#
# 0.57 is where all 27 labelled true pairs sit at or above (the lowest
# was 0.5708). Set higher and real matches are discarded silently,
# before anything can recover them -- at the previous 0.65, four
# labelled true pairs fell below the band, including SpaceX's Starship
# launch date carried by two outlets at 0.5926.
#
# The cost is the judge's bill, and it is the one number here still
# unmeasured: `pending-pairs/` was only ever exhaustive above 0.65, so
# how many pairs a run actually lands in [0.57, 0.65) is not known yet.
# The next `nc cluster` run reports it. If that queue turns out too
# expensive for T24, raise this number and accept losing the matches
# below it -- but raise it against a measured count, not a guess.
tau_low: 0.57

# docs/ARCHITECTURE.md, Clustering: "Window: items from the last 4
# days." Restated here rather than inlined in the module, per CLAUDE.md.
# Not a tuning knob in the same sense as the thresholds: it is a
# statement about how long outlets take to pick up each other's stories.
# Note that it bounds which items can form *new* links, not how long a
# cluster lives -- membership is monotonic, see src/nc/cluster.py.
window_days: 4

# docs/ARCHITECTURE.md, Clustering: "A cluster is emitted only with two
# or more distinct outlets." A product invariant, not a threshold to
# tune: a story only one outlet ran has nothing to compare, which is the
# entire point of the site. It lives here because CLAUDE.md puts
# numbers in config/, not because lowering it to 1 is a supported thing
# to do.
min_outlets: 2

# ===========================================================================
# T22's labelling corpus (nc.labelling / `nc label`). NOT the judge queue.
# ===========================================================================
#
# These three knobs do not affect clustering (union-find never reads
# them) and they do not affect T24's judge (`pending-pairs/`, gated by
# tau_low/tau_high above). They control a *separate*, stratified sample
# of pairs `nc cluster` writes to `data/label-sample/` so a human doing
# `nc label` also sees pairs well below tau_low (clear negatives, to
# anchor the bottom of the curve) and pairs above tau_high (clear
# positives, so `nc tune` can measure precision above the current link
# threshold, not just inside the band). See docs/CLUSTERING.md, "The
# labelling corpus", for why this is a second directory rather than a
# change to tau_low: tau_low also gates T24's paid LLM judge queue, and
# widening it to get better labels would queue thousands of pairs for
# judging every three hours. Do not repurpose these three knobs for
# anything that touches clustering or the judge.

# The lowest score a pair is considered for the labelling sample.
# Below it, a pair is assumed obviously unrelated and not worth a
# human's time. Buckets run from here up to a cosine of 1.0.
sample_floor: 0.30

# Width of one labelling bucket. `nc cluster` samples up to
# sample_bucket_cap pairs from each [sample_floor, sample_floor+width),
# ..., [1.0-width, 1.0] slice of the score range, so a labelling session
# gets even coverage of the whole range instead of only the pairs
# nearest tau_high.
sample_bucket_width: 0.05

# Cap per bucket. Bounds the labelling-sample files `nc cluster` can
# write in one run to roughly
# ceil((1.0 - sample_floor) / sample_bucket_width) * sample_bucket_cap,
# regardless of how large the window or the corpus gets -- see
# `nc.cluster.select_label_sample`'s docstring for why the bound holds
# and stays stable as new pairs accumulate.
sample_bucket_cap: 20
