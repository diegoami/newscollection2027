# Local sentence-embedding model for nc.embed / `nc embed`.
#
# CLAUDE.md: "Model ids and thresholds live in config/, never inline in
# code." A new file rather than adding to config/feeds.yaml because
# embedding is a separate component with its own cache directory and
# batch size, not another feed threshold.
#
# model_id: a `model2vec` static sentence-embedding model -- free,
# deterministic, no API, no torch, no onnxruntime. docs/ARCHITECTURE.md's
# cost model rules out a transformer + torch stack: ingest and clustering
# must stay free on a GitHub Actions runner that fires every three hours
# (docs/PLAN.md T13), and `sentence-transformers` would pull hundreds of
# MB to over a GB of torch onto that runner on every cold cache. See
# src/nc/embed.py's module docstring for the full comparison, including
# why the ONNX-runtime alternative (`fastembed`) was rejected too.
model_id: "minishlab/potion-base-8M"

# Where model weights are cached (HF_HOME, set by
# nc.embed.Model2VecBackend before model2vec/huggingface_hub is
# imported). Under .cache/ like nc.sqlite -- gitignored, never
# committed -- and cached between runs with actions/cache in
# .github/workflows/embed-check.yml (and, once T21 wires embedding into
# ingest.yml, there too), so a cold-start download only happens when
# that cache misses.
model_dir: ".cache/hf-models"

# Sentences per model2vec `encode()` call. model2vec's own default is
# 1024; this project embeds items from a four-day clustering window and
# roughly fifty clusters a night (docs/ARCHITECTURE.md's cost model), so
# a smaller batch keeps peak memory flat without costing meaningful
# throughput on that volume.
batch_size: 64

# Candidate models for `nc bench-embed`, which scores each one against
# labels/pairs.jsonl and reports how much of the range it gets right
# enough to auto-link (src/nc/bench.py). Listing a model here does not
# make it live -- `model_id` above is what runs; this is the shortlist
# an experiment measures before that changes.
#
# Why the list is all model2vec: the constraint that chose this library
# has not moved. Ingest runs 8 times a day on a free runner
# (docs/ARCHITECTURE.md's cost model), so a candidate has to stay
# torch-free and onnxruntime-free. A larger static distillation is the
# only upgrade that costs nothing architecturally -- same pure-numpy
# inference, same determinism, just a bigger weights file behind
# actions/cache. If none of these moves recall@p1.0, that is itself the
# answer: the ceiling is the task, not the model, and the judge should
# decide the band rather than a threshold.
bench_candidates:
  - "minishlab/potion-base-8M"
  - "minishlab/potion-base-32M"
  - "minishlab/potion-retrieval-32M"
