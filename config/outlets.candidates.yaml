# Outlet candidates for newscollection2027.
#
# Compiled 2026-09-16 by T09 and measured the same day. Every feed url
# was fetched once from a GitHub Actions ubuntu-latest runner with
# `scripts/probe_feeds.py` (feedparser): the development sandbox has no
# egress to news domains, so measurement happens on a runner.
#
# 40 feed urls across 42 candidates (recode and reuters have no feed to
# probe). 32 returned entries and all 32 carry a real lede.
#
# One fetch is one sample at one moment. `entries_per_fetch` is capped by
# what each feed chooses to serve, so `items_last_7d` is a floor for any
# feed whose whole payload falls inside the window, and the gaps and ages
# are a snapshot. `terms` was not measured for anyone: no robots.txt and
# no terms page was read.
#
# `score_basis` records, per criterion, whether the score came from the
# measurement, from editorial judgement (`prior`), or from nothing
# (`unmeasured`, for feeds that returned no entries). Overlap is a prior
# by nature: one fetch per outlet cannot show which outlets carry the
# same story. See docs/OUTLETS.md for the method and the caveats.
#
# T10 regenerates these numbers with `nc feeds check` before writing
# config/outlets.yaml.

compiled_on: 2026-09-16
measured_on: 2026-09-16
measured: true
measurement_method: >-
  scripts/probe_feeds.py on a GitHub Actions ubuntu-latest runner,
  one feedparser fetch per url at about 13:30 UTC, user agent
  "newscollection2027/0.1 (+feed evaluation)"

scoring:
  max_score: 60
  gate: has_lede
  weights:
    lede: 4
    overlap: 3
    volume: 2
    reachability: 1
    canonical: 1
    terms: 1
  bands:
    lede: >-
      from lede_words_median: 5 at 30 or more, 4 at 20, 3 at 12, 2 at 8,
      1 below that; 0 when the feed returned no entries to measure
    overlap: >-
      prior, not measurable from one fetch: editorial judgement about how
      often this outlet carries the same story as the rest of the set
    volume: >-
      from items_last_7d: 5 at 40 or more, 4 at 20, 3 at 10, 2 at 4, 1 at
      1, 0 at none; a feed whose entries all fall inside the window is
      capped by entries_per_fetch, so it is scored from median_gap_hours
      instead (5 at 2 h or less, 4 at 6 h, 3 at 12 h, 2 at 24 h, 1 slower);
      capped at 3 when age_of_newest_hours is over 12
    reachability: >-
      5 for 200 with entries, 4 for a redirect to entries, 1 for a feed
      that answered or was blocked but returned no entries, 0 for 404 or
      for no feed url at all
    canonical: >-
      5 when no tracking parameter was seen, 3 for utm_ only, 2 when a
      non-standard parameter is in play, 0 when nothing was measured
    terms: >-
      prior, unmeasured: no robots.txt, feed documentation or terms page
      was read for any candidate, and none of this is legal advice

