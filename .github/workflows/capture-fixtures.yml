name: capture-fixtures

# Temporary. Captures the first few entries of each configured feed as
# test fixtures for T11, byte-for-byte apart from the dropped entries, so
# normalization is tested against what outlets really send rather than
# what we imagine they send. The development sandbox has no egress to
# news domains, so the capture happens here and comes back through the
# job log. Deleted in the same PR that uses its output.

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/capture-fixtures.yml"]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - name: Capture fixtures
        run: |
          uv run --no-project --with pyyaml python - <<'PY'
          import re, urllib.request, pathlib, yaml

          KEEP = 3
          UA = "newscollection2027/0.1 (+fixture capture)"
          out = pathlib.Path("tests/fixtures/feeds")
          out.mkdir(parents=True, exist_ok=True)

          for o in yaml.safe_load(open("config/outlets.yaml"))["outlets"]:
              req = urllib.request.Request(o["feed_url"], headers={"User-Agent": UA})
              raw = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "replace")
              # Keep the document intact and drop all but the first few items,
              # so namespaces, CDATA and date formats survive exactly.
              for tag in ("item", "entry"):
                  spans = [m.span() for m in re.finditer(rf"<{tag}[\s>].*?</{tag}>", raw, re.S)]
                  if len(spans) > KEEP:
                      raw = raw[: spans[KEEP][0]] + raw[spans[-1][1] :]
                      break
              (out / f"{o['slug']}.xml").write_text(raw, encoding="utf-8")
              print(f"captured {o['slug']:<20} {len(raw):>7} chars, {min(len(spans), KEEP)} entries")
          PY

      - name: Commit the fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/feeds
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "T11: capture real feed fixtures, one per outlet

          Captured on a runner because the development sandbox has no egress
          to news domains. First three entries of each configured feed,
          with the rest of the document left byte-for-byte so namespaces,
          CDATA and date formats survive for the normalization tests."
          git push origin HEAD:${GITHUB_REF_NAME}
