name: feeds-check

# T10. Fetches every configured feed and fails if any is unreachable,
# empty, title-only or stale. The development sandbox has no egress to
# news domains, so this is where the AC of T10 actually gets
# demonstrated; see docs/OUTLETS.md, "Measurement: fetched on a runner,
# not in this sandbox".

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv python install 3.12

      - run: uv run nc feeds check
