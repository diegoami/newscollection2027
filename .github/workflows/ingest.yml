name: ingest

# T13, extended by T21. Every three hours: pull the data repo, fetch
# feeds, embed and cluster them, and push back only if something
# changed. See docs/WORKFLOW.md,
# "Every three hours: ingest", and docs/ARCHITECTURE.md's runtime
# topology diagram.
#
# The cron only becomes active once this file is on the default branch
# (main) -- GitHub does not schedule workflows that live only on a
# feature branch. `workflow_dispatch` lets it be run on demand before
# and after that, e.g. to demonstrate the AC.

on:
  schedule:
    - cron: "0 */3 * * *" # every three hours, on the hour, UTC
  workflow_dispatch:
    inputs:
      force_failure:
        description: >-
          Fail on purpose, to exercise the failure issue (T52). Only
          reachable from a manual run, and the whole point of it is that
          the failure path can be demonstrated without waiting for a real
          outage or committing a broken workflow -- an alerting path that
          has never fired once is a guess.
        type: boolean
        default: false

# `contents: write` is for the `repository_dispatch` call at the end
# (POST /repos/{owner}/{repo}/dispatches requires the Contents: write
# permission on the token that calls it -- see the step below). It is
# not used, and must never be used, to push anything to *this*
# repository: per CLAUDE.md, automation pushes only to the data repo,
# and that push is authenticated separately with `secrets.DATA_REPO_TOKEN`,
# not with this job's GITHUB_TOKEN.
permissions:
  contents: write

# Runs must never overlap: two ingests racing on the same data-repo
# checkout could interleave `git add`/`commit`/`push` and corrupt the
# clone or the item files. `cancel-in-progress: false` (not true, unlike
# check.yml) because the risk here is different from a test job: a
# cancelled test run just gets redone, but cancelling this job mid-push
# could leave the data repo's working tree committed-but-unpushed, or
# GitHub Actions could tear the runner down between `git commit` and
# `git push`. Queuing the next scheduled/dispatched run behind the
# current one is cheap (ingest is idempotent, per T12's AC) and never
# corrupts anything; cancelling a push might.
concurrency:
  group: data
  cancel-in-progress: false

env:
  UV_LOCKED: "1"

jobs:
  # Not `check`: T03 registers the bare `check` as the required status
  # check on main, and GitHub matches check runs by name. A feed outage
  # or an ingest bug must never be able to post a red `check` and block
  # an unrelated PR from merging -- feeds-check.yml names its job
  # `feeds` for the identical reason.
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # T52. Deliberately first: a forced failure should exercise the
      # reporting path, not half an ingest.
      - name: Fail on purpose (T52)
        if: inputs.force_failure
        run: |
          echo "ingest: failing on purpose to exercise T52's failure issue"
          exit 1

      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv python install 3.12

      # Authenticate git to the data repo before touching it, so both
      # `nc sync pull` and `nc sync push` go through without either
      # command needing to know about tokens (nc.sync deliberately only
      # knows plain git, per its module docstring). The rewrite is
      # scoped to this one repo URL -- it must match config/sync.yaml's
      # `repo_url` exactly -- so it cannot affect the checkout of this
      # repo (a separate URL) or leak the token to any other host.
      # `git config --global` writes to the runner's own $HOME/.gitconfig,
      # which is never part of any checkout and is discarded with the
      # runner; the token is never written into a committed file, and is
      # not echoed, so it never reaches the logs. A bad or missing token
      # surfaces here as an ordinary git auth failure the first time
      # `nc sync push` actually pushes (see below), not as a silent
      # no-op: `git push` exits non-zero, `nc.sync.push`'s `_run(...,
      # check=True)` raises, and `nc sync push` crashes with a visible
      # traceback and a failed step.
      - name: Authenticate to the data repo
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${DATA_REPO_TOKEN}@github.com/diegoami/newscollection2027-data.git".insteadOf \
            "https://github.com/diegoami/newscollection2027-data.git"

      # NC_DATA_ROOT is left unset here, so it defaults to `data/`
      # under the checkout (nc.store.DEFAULT_DATA_ROOT) -- already in
      # this repo's .gitignore and thrown away with the runner, exactly
      # like every other environment that doesn't set it explicitly.
      #
      # `nc sync pull` rather than a second `actions/checkout` step:
      # the data repo is *currently* an empty, unborn-`main` repository
      # (T03), and `nc.sync.pull` was already written (T12) to handle
      # exactly that case -- an empty clone with no branch checked out
      # falls through to `git checkout -B <branch>` -- whereas
      # `actions/checkout` expects a ref that already exists and is not
      # built for an unborn default branch. Using `nc sync pull` also
      # keeps every bit of git knowledge about the data repo inside
      # `nc.sync`, per its module docstring and CLAUDE.md, instead of
      # splitting it between the module and the workflow YAML.
      - run: uv run nc sync pull

      - run: uv run nc ingest

      # T21. Clustering needs vectors and nothing in this workflow
      # produced them before, so `nc embed` (T20) runs here, between
      # ingest and cluster: ingest appends the new items, embed gives
      # them vectors, cluster links them. `nc cluster` deliberately does
      # not embed anything itself (see src/nc/cluster.py and nc.cli's
      # `_cluster`), so if this step is ever removed or fails, clustering
      # does not silently produce empty output -- it reports the items it
      # had no vector for.
      #
      # Both caches are keyed on config/embed.yaml, so changing the model
      # id busts them and nothing is reused across models.
      #
      # The model cache mirrors embed-check.yml's, which is what
      # docs/WORKFLOW.md means by "The embedding model is cached between
      # runs with actions/cache": without it this job downloads the model
      # again every three hours.
      - name: Cache the embedding model
        uses: actions/cache@v5
        with:
          path: .cache/hf-models
          key: embed-model-${{ hashFiles('config/embed.yaml') }}

      # The vector cache is a different shape: it grows, so it needs a
      # key that changes every run plus a restore-key prefix to load the
      # newest previous one (actions/cache entries are immutable -- a
      # fixed key would be written once and never updated again).
      # .cache/vectors.sqlite is never committed (CLAUDE.md: SQLite lives
      # in .cache/), and it is only a cache: a miss costs a re-embed of
      # the stored items, not wrong output.
      - name: Cache the item vectors
        uses: actions/cache@v5
        with:
          path: .cache/vectors.sqlite
          key: vectors-${{ hashFiles('config/embed.yaml') }}-${{ github.run_id }}
          restore-keys: |
            vectors-${{ hashFiles('config/embed.yaml') }}-

      - run: uv run nc embed

      - run: uv run nc cluster

      # `nc sync push` (T12) already does exactly step 5 of the task:
      # it commits and pushes only when `git status --porcelain` on the
      # data root is non-empty, so a no-op ingest (T12's idempotent
      # append) produces no commit. Its stdout is one of two fixed
      # strings; that's parsed here, rather than duplicating the
      # git-diff check in YAML, to decide whether to fire the dispatch
      # below.
      - name: nc sync push
        id: sync_push
        run: |
          output="$(uv run nc sync push)"
          echo "$output"
          if [ "$output" = "sync push: pushed" ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      # Tell the code repo a push actually happened, only then, so the
      # deploy workflow (T42) never rebuilds and republishes the site
      # for a no-op ingest run.
      #
      # Token: the default `GITHUB_TOKEN` is enough here, and is used
      # instead of `DATA_REPO_TOKEN`. Two things that might look like
      # they'd block it, don't: (1) `GITHUB_TOKEN` is scoped to this
      # repository only, which is fine because we are dispatching *to*
      # this same repository, not a foreign one; (2) GitHub's docs on
      # triggering a workflow from a workflow note that events made
      # with `GITHUB_TOKEN` do not normally start further workflow
      # runs (the anti-recursion rule that bit push-based approaches),
      # but call out `repository_dispatch` (and `workflow_dispatch`) as
      # explicit exceptions to that rule. What it does need is the
      # `contents: write` permission granted above -- the REST endpoint
      # `POST /repos/{owner}/{repo}/dispatches` requires write access to
      # repository contents on the calling token.
      - name: Notify code repo (repository_dispatch data-updated)
        if: steps.sync_push.outputs.pushed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"data-updated"}'

  # T52. A scheduled workflow that fails quietly is a pipeline that stops
  # and does not say so: GitHub emails the owner on the first failure of a
  # cron run and then goes quiet, and the next sign would be a site three
  # days stale. An issue is the opposite -- it stays open and visible until
  # someone closes it.
  #
  # One issue, not one per run. The first failure opens it; every failure
  # after that adds a comment, so a week of failures is one thread with a
  # week of evidence rather than fifty-six issues. It is found by exact
  # title rather than by a label, because a label has to exist first and a
  # missing one fails the create.
  report-failure:
    needs: ingest
    if: failure()
    runs-on: ubuntu-latest
    # Replaces the workflow-level `contents: write` for this job: it opens
    # an issue and does nothing else. It must never be able to push.
    permissions:
      issues: write
    steps:
      # `gh` rather than curl (which ingest uses for the dispatch): this
      # needs to search, then branch, then create or comment, and the same
      # thing in curl is thirty lines of jq for no gain. It is preinstalled
      # on the runner.
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Ingest workflow is failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --limit 100 \
            --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"

          body="The ingest workflow failed.

          Run: $RUN_URL
          Commit: \`$GITHUB_SHA\`
          Triggered by: \`$GITHUB_EVENT_NAME\`

          The next scheduled run will try again in at most three hours, and
          feeds overlap, so a single failure does not lose items. Repeated
          failures do: feeds only expose the last 10 to 30 entries.

          Close this issue once the run is green again."

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "report-failure: commented on #$existing"
          else
            number="$(gh issue create --title "$TITLE" --body "$body" | tail -1)"
            echo "report-failure: opened $number"
          fi
